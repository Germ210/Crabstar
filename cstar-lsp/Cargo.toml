[package]
name = "cstar-lsp"
version = "0.1.0"
edition = "2024"

[dependencies]
dashmap = "6.2.1"
ropey = "1.6.1"
tokio = {version = "1.52.3", features = ["macros", "rt-multi-thread", "io-std"]}
tower-lsp-server = "0.23.0"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = {version = "0.3.23", features = ["env-filter"] }
vfs = "0.13.0"
crabstar-frontend = { path = "../crabstar-frontend/"}
